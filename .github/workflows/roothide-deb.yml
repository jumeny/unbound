name: Build RootHide Debian package

on:
  workflow_dispatch:
  push:
    branches: [roothide-build]
    paths:
      - "packages/loader/**"
      - ".github/scripts/build-roothide-deb.sh"
      - ".github/workflows/roothide-deb.yml"

concurrency:
  group: roothide-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      THEOS_PACKAGE_SCHEME: roothide
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go build tools
        uses: ./.github/actions/setup-go-tools

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid make autoconf automake libtool dpkg
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          {
            echo "$(brew --prefix make)/libexec/gnubin"
            echo "$(brew --prefix autoconf)/bin"
            echo "$(brew --prefix automake)/bin"
            echo "$(brew --prefix libtool)/bin"
            echo "$RUNNER_TEMP/theos/bin"
          } >> "$GITHUB_PATH"

      - name: Install RootHide Theos
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          test -d "$THEOS/makefiles"
          test -x "$THEOS/bin/nic.pl" || test -d "$THEOS/bin"

      - name: Build and verify RootHide package
        shell: bash
        run: bash .github/scripts/build-roothide-deb.sh

      - name: Upload RootHide package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: unbound-roothide-deb
          path: |
            packages/loader/ios/packages/*.deb
            packages/loader/ios/packages/*.deb.sha256
          if-no-files-found: error
          retention-days: 14
